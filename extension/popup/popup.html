<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>X → WhatsApp</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; width: 280px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
    h2 { font-size: 12px; margin: 12px 0 6px; font-weight: 600; color: #444; }
    p { font-size: 12px; color: #555; margin: 6px 0; }
    .status-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-on { background: #25D366; }
    .dot-off { background: #999; }
    .dot-warn { background: #ff9900; }
    .dot-err { background: #dc3545; }
    select { width: 100%; padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 6px; }
    button { font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: #25D366; color: #fff; border-color: #25D366; }
    button.primary:hover { background: #1ea952; }
    button:hover:not(:disabled) { background: #ebebeb; }
    button.primary:hover:not(:disabled) { background: #1ea952; }
    #message { font-size: 12px; min-height: 18px; margin-top: 6px; }
    .muted { color: #777; }
    .error { color: #b00020; }
    .success { color: #0a7c40; }
  </style>
</head>
<body>
  <h1>X → WhatsApp</h1>

  <h2>WhatsApp</h2>
  <div id="waStatus" class="status-row"><span class="dot dot-off"></span> <span id="waStatusText">Checking…</span></div>
  <div id="waActionWrap">
    <button id="connectBtn" class="primary" disabled>Connect WhatsApp</button>
    <button id="checkBtn">Check Connection</button>
  </div>

  <h2>Destination Channel</h2>
  <select id="channelSelect" disabled>
    <option value="">Loading…</option>
  </select>
  <button id="refreshBtn" disabled>Refresh Channels</button>

  <div id="message" class="muted"></div>

  <script src="popup.js"></script>
</body>
</html>
